openai_api_key: ""
openai_base_url: "http://localhost:1234/v1"
ai_model: "AI"
ai_temperature: 0.1
ai_max_tokens: 32768
ai_max_retries: 3
max_file_size: 10485760

target_extensions:

  # Python
  - ".py"

  # C / C++
  - ".c"
  - ".cpp"
  - ".cc"
  - ".cxx"
  - ".h"
  - ".hpp"

  # Go
  - ".go"

  # Rust
  - ".rs"

  # C#
  - ".cs"

  # Java
  - ".java"

  # JavaScript / TypeScript
  - ".js"
  - ".mjs"
  - ".cjs"
  - ".ts"
  - ".jsx"
  - ".tsx"

  # Markup
  - ".html"
  - ".xml"
  
  # Data
  - ".json"
  - ".yaml"
  - ".yml"

  # Scripting
  - ".sh"
  - ".bash"
  - ".zsh"
  - ".bat"
  - ".cmd"
  - ".ps1"

  # Other languages
  - ".php"
  - ".rb"

ignore_dirs:

  # VCS
  - ".git"
  - ".svn"
  - ".hg"

  # Node
  - "node_modules"

  # Python
  - "venv"
  - ".venv"
  - "env"
  - "__pycache__"

  # Build outputs
  - "dist"
  - "build"
  - "target"
  - "bin"
  - "obj"
  - "lib"
  - "libs"

  # IDE
  - ".idea"
  - ".vscode"

prompts:
  standard:
    system: |
      You are CodeSentinel, an expert Cyber Security Auditor.
      Analyze the code for malicious intent, dangerous practices, and obfuscation.
      You MUST return your analysis in valid JSON format with the following keys:
      - "status": One of "SAFE", "WARNING", "DANGER".
      - "reason": A concise explanation (max 2 sentences).
    user: "File Name: {filename}\n\nCode Content:\n```\n{content}\n```"
  deep:
    system: |
      You are CodeSentinel, performing a DEEP SECURITY AUDIT.
      Trace logic and data flow across the main file and its dependencies.
      You MUST return your analysis in valid JSON format with the following keys:
      - "status": One of "SAFE", "WARNING", "DANGER".
      - "reason": A concise explanation of the cross-file threat (max 3 sentences).
    user: |
      MAIN FILE: {filename}
      CODE:
      ```
      {content}
      ```

      DEPENDENCY CONTEXT:
      {context}

tree_sitter:
  python:
    package: "tree_sitter_python"
    extensions: [".py"]
    skeleton_query: |
      (class_definition name: (identifier) @name body: (block) @body)
      (function_definition name: (identifier) @name body: (block) @body)
    deps_query: |
      (import_from_statement module_name: (dotted_name) @mod)
      (import_statement name: (dotted_name) @mod)
      (import_from_statement module_name: (relative_import) name: (dotted_name) @mod)
      (import_from_statement module_name: (relative_import) name: (aliased_import name: (dotted_name) @mod))
  javascript:
    package: "tree_sitter_javascript"
    extensions: [".js", ".ts", ".jsx", ".tsx"]
    skeleton_query: |
      (class_definition name: (identifier) @name)
      (function_definition name: (identifier) @name)
      (method_definition name: (property_identifier) @name)
      (variable_declarator name: (identifier) @name value: (arrow_function))
    deps_query: |
      (import_statement source: (string) @mod)
      (call_expression function: (identifier) @func (#eq? @func "require") arguments: (arguments (string) @mod))
  go:
      package: "tree_sitter_go"
      extensions: [".go"]
      skeleton_query: |
        (function_declaration name: (identifier) @name)
        (method_declaration name: (field_identifier) @name)
        (type_declaration (type_spec name: (type_identifier) @name))
      deps_query: |
        (import_spec path: (interpreted_string_literal) @mod)
        (import_spec path: (raw_string_literal) @mod)
  rust:
      package: "tree_sitter_rust"
      extensions: [".rs"]
      skeleton_query: |
        (function_item name: (identifier) @name)
        (struct_item name: (type_identifier) @name)
        (enum_item name: (type_identifier) @name)
        (impl_item type: (type_identifier) @name)
      deps_query: |
        (use_declaration argument: (_) @mod)
        (extern_crate_declaration name: (identifier) @mod)
  cpp:
      package: "tree_sitter_cpp"
      extensions: [".c", ".cpp", ".cc", ".cxx", ".h", ".hpp"]
      skeleton_query: |
        (function_definition declarator: (function_declarator declarator: (identifier) @name))
        (class_specifier name: (type_identifier) @name)
        (struct_specifier name: (type_identifier) @name)
      deps_query: |
        (preproc_include path: (string_literal) @mod)
        (preproc_include path: (system_lib_string) @mod)
  java:
      package: "tree_sitter_java"
      extensions: [".java"]
      skeleton_query: |
        (class_declaration name: (identifier) @name)
        (interface_declaration name: (identifier) @name)
        (method_declaration name: (identifier) @name)
      deps_query: |
        (import_declaration (_) @mod)
